<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klima-Quiz Asien</title>
<style>
:root {
  /* Layout: Atlas-Gefühl. Titelbild mit den Monsunpfeilen, große Themenkarten in eigenen Farben.
     Fragetypen: Auswahl, Mehrfachauswahl, Zuordnung, Reihenfolge, Lückentext, Zahl, Klick in Skizze. */
  --bg: #edf2f5;
  --surface: #ffffff;
  --surface-2: #f5f8fa;
  --ink: #11222d;
  --muted: #53656f;
  --line: #d2dde4;
  --accent: #0a5f8a;
  --accent-ink: #ffffff;
  --mark: #ffe94a;
  --mark-ink: #11222d;
  --good: #1d7a4a;
  --good-bg: #e0f2e8;
  --bad: #b3362f;
  --bad-bg: #fbe8e5;
  --c-faktoren: #0a5f8a;
  --c-zonen: #2b7a4b;
  --c-monsun: #b45f06;
  --c-land: #8c3f6a;
  --on-c: #ffffff;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d181f; --surface: #162630; --surface-2: #1c2f3b; --ink: #e8eef2; --muted: #9db0bc; --line: #2c4251;
    --accent: #5cb8e0; --accent-ink: #0d181f; --mark: #f2d94e; --mark-ink: #11222d;
    --good: #66d19a; --good-bg: #173a2b; --bad: #ff8a80; --bad-bg: #3d211f;
    --c-faktoren: #5cb8e0; --c-zonen: #6cd09a; --c-monsun: #f0a04b; --c-land: #e08fbd; --on-c: #0d181f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d181f; --surface: #162630; --surface-2: #1c2f3b; --ink: #e8eef2; --muted: #9db0bc; --line: #2c4251;
  --accent: #5cb8e0; --accent-ink: #0d181f; --mark: #f2d94e; --mark-ink: #11222d;
  --good: #66d19a; --good-bg: #173a2b; --bad: #ff8a80; --bad-bg: #3d211f;
  --c-faktoren: #5cb8e0; --c-zonen: #6cd09a; --c-monsun: #f0a04b; --c-land: #e08fbd; --on-c: #0d181f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--font-head); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); }
h2 { font-size: 1.3rem; }
p { margin: 0; }
.muted { color: var(--muted); }
svg.ic { width: 24px; height: 24px; flex: none; }

.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.hero svg { display: block; width: 100%; height: auto; background: var(--surface-2); }
.hero-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.92rem; font-weight: 600; margin-top: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid var(--line); }
.eyebrow { align-self: flex-start; background: var(--mark); color: var(--mark-ink); padding: 1px 8px; border-radius: 2px; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.label { font-weight: 600; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .grid { grid-template-columns: minmax(0, 1fr); } }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 12px 22px; min-height: 48px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.45; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.tcard { --tc: var(--accent); text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 38px 14px 14px; min-height: 76px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--surface); position: relative; }
.tcard[aria-pressed="true"] { border-color: var(--tc); background: var(--surface-2); background: color-mix(in srgb, var(--tc) 9%, var(--surface)); }
.ticon { width: 44px; height: 44px; border-radius: 50%; background: var(--tc); color: var(--on-c); display: grid; place-items: center; flex: none; }
.tbody { display: flex; flex-direction: column; min-width: 0; }
.tname { font-weight: 600; line-height: 1.25; }
.tdesc { color: var(--muted); font-size: 0.88rem; line-height: 1.3; }
.tick { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.tick svg { width: 14px; height: 14px; }
.tcard[aria-pressed="true"] .tick { background: var(--tc); border-color: var(--tc); color: var(--on-c); }

.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tbadge { display: inline-flex; align-items: center; gap: 8px; background: var(--tc, var(--accent)); color: var(--on-c); border-radius: 999px; padding: 4px 14px 4px 6px; font-weight: 600; font-size: 0.92rem; }
.tbadge svg.ic { width: 20px; height: 20px; }
.meta { font-weight: 600; color: var(--muted); font-size: 0.95rem; }
.segs { display: flex; gap: 3px; }
.seg { flex: 1; height: 8px; border-radius: 4px; background: var(--line); min-width: 0; }
.seg.ok { background: var(--good); }
.seg.no { background: var(--bad); }
.seg.cur { background: var(--tc, var(--accent)); }
.kind { align-self: flex-start; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 0.82rem; color: var(--muted); font-weight: 600; }

.q { font-family: var(--font-head); font-size: clamp(1.15rem, 3.6vw, 1.45rem); line-height: 1.35; font-weight: 500; text-wrap: balance; }
.hint { color: var(--muted); font-size: 0.92rem; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 56px; display: flex; gap: 14px; align-items: center; animation: rise 0.25s ease both; }
.opt .letter { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; flex: none; }
.opt .txt { flex: 1; min-width: 0; }
.opt .res { width: 24px; height: 24px; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--tc, var(--accent)); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); }
.opt[aria-pressed="true"] .letter { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.right .letter { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.right .res { color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt.wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.wrong .res { color: var(--bad); }
.opt.dim { opacity: 0.6; }
.figgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.opt.fig { flex-direction: column; align-items: stretch; gap: 8px; }
.opt.fig svg { width: 100%; height: auto; display: block; }
.opt.fig .top { display: flex; justify-content: space-between; align-items: center; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; align-items: center; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); }
@media (max-width: 560px) { .mrow { grid-template-columns: minmax(0, 1fr); } }
.mrow.right { border-color: var(--good); background: var(--good-bg); }
.mrow.wrong { border-color: var(--bad); background: var(--bad-bg); }
.mtxt svg { width: 100%; max-width: 300px; height: auto; display: block; }
.mtxt .lab { display: block; font-weight: 600; color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
.cgrp { display: flex; flex-wrap: wrap; gap: 8px; }
.cbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 44px; }
.cbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.cbtn:disabled { cursor: default; }
select.sel { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 44px; width: 100%; }
.corr { grid-column: 1 / -1; color: var(--good); font-weight: 600; font-size: 0.92rem; }

.orow { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px 8px 12px; background: var(--surface); }
.orow.right { border-color: var(--good); background: var(--good-bg); }
.orow.wrong { border-color: var(--bad); background: var(--bad-bg); }
.orow .n { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 600; flex: none; font-size: 0.9rem; }
.orow .otxt { flex: 1; min-width: 0; }
.omv { display: flex; gap: 6px; }
.mv { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 1rem; }
.mv:disabled { opacity: 0.35; cursor: default; }

.cloze { line-height: 2.5; font-size: 1.05rem; }
.cloze select { font: inherit; color: var(--ink); background: var(--surface-2); border: 2px solid var(--line); border-radius: 8px; padding: 4px 8px; min-height: 40px; max-width: 100%; }
.cloze select.right { border-color: var(--good); background: var(--good-bg); }
.cloze select.wrong { border-color: var(--bad); background: var(--bad-bg); }
.cloze .fix { color: var(--good); font-weight: 600; font-size: 0.9rem; }
.numin { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.numin input { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 8em; min-height: 48px; }
.numin input.right { border-color: var(--good); background: var(--good-bg); }
.numin input.wrong { border-color: var(--bad); background: var(--bad-bg); }

.sketch { width: 100%; max-width: 560px; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); }
.reg { fill: transparent; cursor: pointer; }
.reg:hover, .reg:focus { fill: rgba(10, 95, 138, 0.18); outline: none; }
.reg.right { fill: rgba(29, 122, 74, 0.4); }
.reg.wrong { fill: rgba(179, 54, 47, 0.4); }

.fb { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; animation: rise 0.25s ease both; }
.fb.right { background: var(--good-bg); }
.fb.wrong { background: var(--bad-bg); }
.fb.note { background: var(--surface-2); border: 1px solid var(--line); }
.fb .ft { font-weight: 700; font-size: 1.05rem; }
.fb.right .ft { color: var(--good); }
.fb.wrong .ft { color: var(--bad); }

.result { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.ring { width: 140px; height: 140px; flex: none; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); transition: stroke-dashoffset 0.9s ease; }
.ring text { fill: var(--ink); font-family: var(--font-head); font-weight: 700; }
.ring .sub { fill: var(--muted); font-family: var(--font-body); font-weight: 400; }
.rtext { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 200px; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.trow .ticon { width: 36px; height: 36px; }
.trow .ticon svg.ic { width: 20px; height: 20px; }
.tbar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.tbar span { display: block; height: 100%; background: var(--tc); }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
summary { padding: 12px 14px; cursor: pointer; font-weight: 600; }
details .dbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .opt, .fb { animation: none; } .ring .fg { transition: none; } }
</style>

</head><body>
<main>
  <div id="app"></div>
</main>

<script>
var TOPICS = {
  faktoren: "Klimafaktoren",
  zonen: "Klimazonen",
  monsun: "Monsun: Entstehung",
  land: "Landwirtschaft und Klimawandel"
};
var META = {
  faktoren: { desc: "Höhe, Meer, Gebirge, Breite", path: '<path d="M3 19 9 8l4 6 3-4 5 9z"/>' },
  zonen: { desc: "Zonen und Klimadiagramme", path: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3.5 3.5 14.5 0 18M12 3c-3.5 3.5-3.5 14.5 0 18"/>' },
  monsun: { desc: "ITC, Tief, Sommer und Winter", path: '<path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/>' },
  land: { desc: "Bewässerung, Anbau, Wandel", path: '<path d="M12 21v-9M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/>' },
  check: { path: '<path d="m5 12.5 4.5 4.5L19 7"/>' },
  cross: { path: '<path d="m6 6 12 12M18 6 6 18"/>' }
};
var KIND = { mc: "Einfachauswahl", tf: "Wahr oder falsch", multi: "Mehrfachauswahl", match: "Zuordnung", order: "Reihenfolge", cloze: "Lückentext", num: "Zahl eintragen", hot: "Klick in die Skizze", gmc: "Skizze auswählen" };

/* ---------- Grafiken ---------- */
function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
function fmt(n) { return String(n).replace(".", ",").replace("-", "−"); }

function climateSvg(T, P, tm, ps) {
  var mt = sum(T) / 12, sp = sum(P), x0 = 30, x1 = 252, yb = 116, st = (x1 - x0) / 12, i;
  T = T.map(function (v) { return v + (tm - mt); });
  P = P.map(function (v) { return v * ps / sp; });
  function ty(v) { return yb - v * 2; }
  function py(p) { return yb - (p <= 100 ? p * 0.8 : 80 + (p - 100) * 0.08); }
  var h = '<svg viewBox="0 0 260 200" role="img" aria-label="Klimadiagramm mit Temperaturkurve und Niederschlagssäulen">';
  h += '<rect x="' + x0 + '" y="16" width="' + (x1 - x0) + '" height="160" fill="var(--surface)" stroke="var(--line)"/>';
  [-20, 20, 40].forEach(function (v) { h += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + ty(v) + '" y2="' + ty(v) + '" stroke="var(--line)"/>'; });
  [[-20, "−20"], [0, "0"], [20, "20"], [40, "40"]].forEach(function (t) {
    h += '<text x="' + (x0 - 4) + '" y="' + (ty(t[0]) + 3.5) + '" font-size="10" text-anchor="end" fill="var(--muted)">' + t[1] + "</text>";
  });
  for (i = 0; i < 12; i++) {
    var cx = x0 + (i + 0.5) * st, y = py(P[i]);
    h += '<rect x="' + (cx - st / 2 + 1.5).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (st - 3).toFixed(1) + '" height="' + (yb - y).toFixed(1) + '" fill="var(--accent)" opacity="0.45"/>';
    if (P[i] > 100) h += '<rect x="' + (cx - st / 2 + 1.5).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (st - 3).toFixed(1) + '" height="' + (py(100) - y).toFixed(1) + '" fill="var(--accent)" opacity="0.9"/>';
    h += '<text x="' + cx.toFixed(1) + '" y="192" font-size="10" text-anchor="middle" fill="var(--muted)">' + "JFMAMJJASOND".charAt(i) + "</text>";
  }
  h += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + yb + '" y2="' + yb + '" stroke="var(--ink)"/>';
  h += '<polyline fill="none" stroke="var(--bad)" stroke-width="2.4" stroke-linejoin="round" points="' +
    T.map(function (v, k) { return (x0 + (k + 0.5) * st).toFixed(1) + "," + ty(v).toFixed(1); }).join(" ") + '"/>';
  h += '<text x="' + x0 + '" y="11" font-size="11" font-weight="600" fill="var(--bad)">' + fmt(tm) + ' °C</text>';
  h += '<text x="' + x1 + '" y="11" font-size="11" font-weight="600" text-anchor="end" fill="var(--accent)">' + ps + " mm</text></svg>";
  return h;
}
var DIAG = {
  anadyr: climateSvg([-22, -22, -18, -11, -2, 5, 10, 9, 4, -4, -14, -20], [20, 18, 15, 14, 15, 23, 36, 42, 38, 32, 25, 20], -7.6, 336),
  shenyang: climateSvg([-12, -8, 0, 9, 17, 22, 25, 24, 17, 10, 0, -9], [6, 9, 15, 42, 59, 92, 160, 150, 55, 38, 17, 8], 8.2, 689),
  hanoi: climateSvg([17, 18, 21, 25, 28, 29, 29, 29, 28, 25, 21, 18], [20, 28, 45, 90, 190, 240, 300, 330, 260, 130, 40, 18], 24.0, 1760)
};

function monsunSvg(o) {
  o = o || {};
  var h = '<svg class="sketch" viewBox="0 0 360 230" role="img" aria-label="Skizze: Meer links, Land mit Gebirge rechts, Südwest links und Nordost rechts">';
  h += '<rect width="360" height="230" fill="#e4f0f6"/><circle cx="310" cy="28" r="14" fill="#f6c343"/>';
  h += '<rect x="0" y="172" width="150" height="58" fill="#5aa9d6"/>';
  h += '<path d="M150 172 L250 168 L285 100 L305 125 L325 95 L360 140 L360 230 L150 230 Z" fill="#8fae5b"/>';
  h += '<path d="M250 168 L285 100 L305 125 L325 95 L360 140 L360 168 Z" fill="#7a8a52"/>';
  h += '<text x="8" y="18" font-size="13" font-weight="700" fill="#33505e">SW</text><text x="352" y="18" font-size="13" font-weight="700" text-anchor="end" fill="#33505e">NO</text>';
  if (o.arrows) {
    h += '<g stroke-width="4">' +
      '<line x1="60" y1="158" x2="244" y2="158" stroke="#c0392b"/><polygon points="258,158 240,149 240,167" fill="#c0392b" stroke="none"/>' +
      '<line x1="262" y1="146" x2="262" y2="58" stroke="#1f6fa8"/><polygon points="262,44 253,62 271,62" fill="#1f6fa8" stroke="none"/>' +
      '<line x1="256" y1="44" x2="72" y2="44" stroke="#1f6fa8"/><polygon points="58,44 76,35 76,53" fill="#1f6fa8" stroke="none"/>' +
      '<line x1="52" y1="52" x2="52" y2="138" stroke="#1f6fa8"/><polygon points="52,152 43,134 61,134" fill="#1f6fa8" stroke="none"/></g>';
  }
  if (o.clouds) {
    h += '<ellipse cx="296" cy="82" rx="26" ry="14" fill="#8d99a3"/><ellipse cx="320" cy="90" rx="22" ry="12" fill="#7b8791"/><ellipse cx="274" cy="90" rx="20" ry="11" fill="#7b8791"/>' +
      '<g stroke="#3f78a0" stroke-width="2.5" stroke-linecap="round"><line x1="282" y1="106" x2="279" y2="120"/><line x1="296" y1="106" x2="293" y2="120"/><line x1="310" y1="106" x2="307" y2="120"/><line x1="324" y1="106" x2="321" y2="120"/></g>';
  }
  if (o.markers) {
    [[1, 100, 128], [2, 205, 128], [3, 140, 158], [4, 150, 44], [5, 336, 62]].forEach(function (m) {
      h += '<circle cx="' + m[1] + '" cy="' + m[2] + '" r="12" fill="#fff" stroke="#11222d" stroke-width="1.5"/><text x="' + m[1] + '" y="' + (m[2] + 5) + '" font-size="14" font-weight="700" text-anchor="middle" fill="#11222d">' + m[0] + "</text>";
    });
  }
  (o.regions || []).forEach(function (r) {
    h += '<rect class="reg" tabindex="0" role="button" aria-label="' + r.label + '" data-region="' + r.id + '" x="' + r.x + '" y="' + r.y + '" width="' + r.w + '" height="' + r.h + '"/>';
  });
  return h + "</svg>";
}

function itcSvg(north) {

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

}
function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }

function countFor(topics) { return Q.filter(function (x) { return topics.indexOf(x.t) > -1; }).length; }
function isGap(p) { return typeof p !== "string"; }
function itemHtml(it) { return typeof it === "string" ? it : '<span class="lab">' + it.lab + "</span>" + it.h; }
function itemLab(it) { return typeof it === "string" ? it : it.lab; }

function solution(q) {
  if (q.sol) return q.sol;
  switch (q.type) {
    case "mc": return q.o[q.a];
    case "tf": return q.a ? "Wahr" : "Falsch";
    case "multi": return q.a.map(function (i) { return q.o[i]; }).join("; ");
    case "match": return q.items.map(function (it, i) { return itemLab(it) + ": " + q.choices[q.a[i]]; }).join("; ");
    case "order": return q.items.map(function (s, i) { return (i + 1) + ". " + s; }).join(" ");
    case "cloze": return q.parts.filter(isGap).map(function (g) { return g.opts[g.a]; }).join(", ");
    case "num": return q.a + (q.unit ? " " + q.unit : "");
  }
  return "";
}

      while (cur.seq.every(function (v, k) { return v === k; })) cur.seq = shuffle(range(q.items.length));
      h = '<p class="hint">Verschiebe die Schritte mit den Pfeilen.</p><div class="stack" id="olist">' + orderHtml() + "</div>";
      break;
    case "cloze":
      h = '<p class="cloze" id="cloze">' + q.parts.map(function (p, k) {
        if (!isGap(p)) return p;
        return '<select data-g="' + k + '" aria-label="Lücke"><option value="">…</option>' + p.opts.map(function (w, j) { return '<option value="' + j + '">' + w + "</option>"; }).join("") + "</select>";
      }).join("") + "</p>";
      break;
    case "num":
      h = '<div class="numin"><input id="numin" type="text" inputmode="numeric" autocomplete="off" aria-label="Antwort"><span>' + (q.unit || "") + "</span></div>";
      break;
    case "hot":
      h = '<p class="hint">Tippe oder klicke direkt in die Skizze.</p>' + monsunSvg(q.svgOpts);
      break;
  }
  if (["mc", "tf", "gmc", "hot"].indexOf(q.type) < 0) h += '<div class="row"><button class="btn" id="check" type="button">Prüfen</button></div>';
  return h;
}

function orderHtml() {
  return cur.seq.map(function (idx, pos) {
    return '<div class="orow" data-pos="' + pos + '"><span class="n">' + (pos + 1) + '</span><span class="otxt">' + cur.q.items[idx] + '</span><span class="omv">' +
      '<button class="mv" type="button" data-dir="-1" data-pos="' + pos + '" aria-label="nach oben"' + (pos === 0 ? " disabled" : "") + '>&#9650;</button>' +
      '<button class="mv" type="button" data-dir="1" data-pos="' + pos + '" aria-label="nach unten"' + (pos === cur.seq.length - 1 ? " disabled" : "") + ">&#9660;</button></span></div>";
  }).join("");
}

function question() {
  var q = run.pool[run.i];
  var segs = run.pool.map(function (_, i) {
    var c = i === run.i ? "cur" : (run.results[i] ? (run.results[i].ok ? "ok" : "no") : "");
    return '<span class="seg ' + c + '"></span>';
  }).join("");
  var s = streak();
  var inner = body(q);
  app.innerHTML =
    '<section class="card" style="--tc:var(--c-' + q.t + ')">' +
    '<div class="qtop"><span class="tbadge" style="--tc:var(--c-' + q.t + ')">' + ic(q.t) + TOPICS[q.t] + "</span>" +
    '<span class="meta">Aufgabe ' + (run.i + 1) + " von " + run.pool.length + (s >= 2 ? " · Serie " + s : "") + "</span></div>" +
    '<div class="segs" role="progressbar" aria-valuemin="1" aria-valuemax="' + run.pool.length + '" aria-valuenow="' + (run.i + 1) + '">' + segs + "</div>" +
    '<span class="kind">' + KIND[q.type] + "</span>" +
    '<p class="q">' + q.q + "</p>" + inner +
    '<div id="fb" aria-live="polite"></div>' +
    '<div class="row"><button class="btn" id="next" type="button" hidden>' + (run.i + 1 === run.pool.length ? "Zur Auswertung" : "Nächste Aufgabe") + "</button></div></section>";
}

function finish(ok) {
  var q = cur.q;
  cur.answered = true;
  run.results.push({ item: q, ok: ok });
  document.querySelectorAll(".seg")[run.i].className = "seg " + (ok ? "ok" : "no");
  var check = document.getElementById("check"); if (check) check.hidden = true;
  document.getElementById("fb").innerHTML = '<div class="fb ' + (ok ? "right" : "wrong") + '"><span class="ft">' + (ok ? "Richtig" : "Nicht ganz") + "</span>" +
    (ok ? "" : "<span><strong>Richtig:</strong> " + solution(q) + "</span>") + "<span>" + q.e + "</span></div>";
  var nb = document.getElementById("next"); nb.hidden = false; nb.focus();
}

function say(msg) { document.getElementById("fb").innerHTML = '<div class="fb note">' + msg + "</div>"; }

function immediate(orig) {
  var q = cur.q, correct = q.type === "tf" ? (q.a ? 0 : 1) : q.a, btns = document.querySelectorAll("#opts .opt");
  for (var i = 0; i < btns.length; i++) {
    var o = parseInt(btns[i].getAttribute("data-i"), 10);
    btns[i].disabled = true;
    var slot = btns[i].querySelector(".res");
    if (o === correct) { btns[i].classList.add("right"); slot.outerHTML = iconRes("check"); }
    else if (o === orig) { btns[i].classList.add("wrong"); slot.outerHTML = iconRes("cross"); }
    else btns[i].classList.add("dim");
  }
  finish(orig === correct);
}

function evaluate() {
  var q = cur.q, ok = true, i;
  if (q.type === "multi") {
    var btns = document.querySelectorAll("#opts .opt"), chosen = [];
    for (i = 0; i < btns.length; i++) if (btns[i].getAttribute("aria-pressed") === "true") chosen.push(parseInt(btns[i].getAttribute("data-m"), 10));
    if (!chosen.length) { say("Wähle mindestens eine Antwort aus."); return; }
    for (i = 0; i < btns.length; i++) {
      var m = parseInt(btns[i].getAttribute("data-m"), 10), isC = q.a.indexOf(m) > -1, picked = chosen.indexOf(m) > -1;
      btns[i].disabled = true;
      var slot = btns[i].querySelector(".res");
      if (isC && picked) { btns[i].classList.add("right"); slot.outerHTML = iconRes("check"); }
      else if (isC && !picked) { btns[i].classList.add("right"); btns[i].classList.add("dim"); ok = false; }
      else if (!isC && picked) { btns[i].classList.add("wrong"); slot.outerHTML = iconRes("cross"); ok = false; }
      else btns[i].classList.add("dim");
    }
    return finish(ok);
  }
  if (q.type === "match") {
    var rows = document.querySelectorAll(".mrow"), vals = [];
    for (i = 0; i < rows.length; i++) {
      var sl = rows[i].querySelector("select"), v;
      if (sl) v = sl.value; else { var p = rows[i].querySelector('.cbtn[aria-pressed="true"]'); v = p ? p.getAttribute("data-c") : ""; }
      if (v === "") { say("Bitte ordne zuerst alle Zeilen zu."); return; }
      vals.push(parseInt(v, 10));
    }
    for (i = 0; i < rows.length; i++) {
      var idx = parseInt(rows[i].getAttribute("data-row"), 10), good = vals[i] === q.a[idx];
      rows[i].classList.add(good ? "right" : "wrong");
      Array.prototype.forEach.call(rows[i].querySelectorAll("button,select"), function (b) { b.disabled = true; });
      if (!good) { ok = false; rows[i].insertAdjacentHTML("beforeend", '<div class="corr">Richtig: ' + q.choices[q.a[idx]] + "</div>"); }
    }
    return finish(ok);
  }
  if (q.type === "order") {
    var orows = document.querySelectorAll(".orow");
    for (i = 0; i < orows.length; i++) {
      var g = cur.seq[i] === i;
      orows[i].classList.add(g ? "right" : "wrong");
      if (!g) ok = false;
    }
    Array.prototype.forEach.call(document.querySelectorAll(".mv"), function (b) { b.disabled = true; });
    return finish(ok);
  }
  if (q.type === "cloze") {
    var sels = document.querySelectorAll("#cloze select");
    for (i = 0; i < sels.length; i++) if (sels[i].value === "") { say("Bitte fülle alle Lücken aus."); return; }
    for (i = 0; i < sels.length; i++) {
      var part = q.parts[parseInt(sels[i].getAttribute("data-g"), 10)], gd = parseInt(sels[i].value, 10) === part.a;
      sels[i].classList.add(gd ? "right" : "wrong"); sels[i].disabled = true;
      if (!gd) { ok = false; sels[i].insertAdjacentHTML("afterend", ' <span class="fix">(' + part.opts[part.a] + ")</span>"); }
    }
    return finish(ok);
  }
  if (q.type === "num") {
    var inp = document.getElementById("numin"), raw = inp.value.replace(/[^0-9,.\-]/g, "").replace(",", ".");
    if (raw === "") { say("Trage eine Zahl ein."); return; }
    ok = parseFloat(raw) === q.a;
    inp.classList.add(ok ? "right" : "wrong"); inp.disabled = true;
    return finish(ok);
  }
}

function next() {
  run.i++;
  if (run.i >= run.pool.length) result(); else question();
}

function result() {
  var total = run.results.length;
  var right = run.results.filter(function (r) { return r.ok; }).length;
  var pct = Math.round((right / total) * 100);
  var title = pct >= 90 ? "Bereit für den Test" : pct >= 70 ? "Gut vorbereitet" : pct >= 50 ? "Auf dem richtigen Weg" : "Noch etwas Übung";
  var msg = pct >= 90 ? "Du beherrschst den Stoff sehr sicher." : pct >= 70 ? "Wiederhole noch die Aufgaben, die du falsch hattest." : pct >= 50 ? "Schau dir die schwächeren Themen unten noch einmal an." : "Lies deine Mitschrift noch einmal und starte das Quiz erneut.";
  var rows = Object.keys(TOPICS).map(function (k) {
    var rs = run.results.filter(function (r) { return r.item.t === k; });
    if (!rs.length) return "";
    var ok = rs.filter(function (r) { return r.ok; }).length;
    var p = Math.round((ok / rs.length) * 100);
    return '<div class="trow" style="--tc:var(--c-' + k + ')"><span class="ticon">' + ic(k) + '</span><span class="tname">' + TOPICS[k] + '</span><span class="label">' + ok + " von " + rs.length + '</span><div class="tbar"><span style="width:' + p + '%"></span></div></div>';
  }).join("");
  var wrong = run.results.filter(function (r) { return !r.ok; });
  var review = wrong.length ? '<div class="stack"><div class="label">Das war falsch</div>' + wrong.map(function (r) {
    return "<details><summary>" + r.item.q + '</summary><div class="dbody"><span><strong>Richtig:</strong> ' + solution(r.item) + '</span><span class="muted">' + r.item.e + "</span></div></details>";
  }).join("") + "</div>" : "";
  var C = 2 * Math.PI * 54;
  app.innerHTML =
    '<section class="card"><div class="result">' +
    '<svg class="ring" viewBox="0 0 140 140" role="img" aria-label="' + right + " von " + total + ' richtig"><circle class="bg" cx="70" cy="70" r="54" fill="none" stroke-width="12"/>' +
    '<circle class="fg" id="ringfg" cx="70" cy="70" r="54" fill="none" stroke-width="12" stroke-linecap="round" transform="rotate(-90 70 70)" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/>' +
    '<text x="70" y="72" text-anchor="middle" font-size="30">' + pct + '%</text><text class="sub" x="70" y="94" text-anchor="middle" font-size="13">' + right + " von " + total + "</text></svg>" +
    '<div class="rtext"><span class="eyebrow">Auswertung</span><h2>' + title + '</h2><p class="muted">' + msg + "</p></div></div>" +
    '<div class="stack"><div class="label">Nach Thema</div>' + rows + "</div>" + review +
    '<div class="row">' + (wrong.length ? '<button class="btn" id="redo" type="button">Fehler wiederholen (' + wrong.length + ")</button>" : "") +
    '<button class="btn ghost" id="again" type="button">Neues Quiz</button></div></section>';
  var fg = document.getElementById("ringfg");
  requestAnimationFrame(function () { requestAnimationFrame(function () { fg.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(1); }); });
  run.wrongItems = wrong.map(function (r) { return r.item; });
}

app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-topic]");
  if (t) {
    var k = t.getAttribute("data-topic"), i = sel.topics.indexOf(k);
    if (i > -1) sel.topics.splice(i, 1); else sel.topics.push(k);
    start(); return;
  }
  var n = e.target.closest("[data-n]");
  if (n) { sel.n = parseInt(n.getAttribute("data-n"), 10); start(); return; }
  if (cur && !cur.answered && run && document.getElementById("fb")) {
    var q = cur.q;
    var reg = e.target.closest("[data-region]");
    if (reg && q.type === "hot") {
      var id = reg.getAttribute("data-region"), ok = id === q.a;
      Array.prototype.forEach.call(document.querySelectorAll(".reg"), function (r) {
        if (r.getAttribute("data-region") === q.a) r.classList.add("right");
        else if (r === reg) r.classList.add("wrong");
        r.style.pointerEvents = "none";
      });
      finish(ok); return;
    }
    var op = e.target.closest(".opt");
    if (op && op.hasAttribute("data-i")) { immediate(parseInt(op.getAttribute("data-i"), 10)); return; }
    if (op && op.hasAttribute("data-m")) { op.setAttribute("aria-pressed", op.getAttribute("aria-pressed") === "true" ? "false" : "true"); return; }
    var cb = e.target.closest(".cbtn");
    if (cb) {
      Array.prototype.forEach.call(cb.parentNode.children, function (s) { s.setAttribute("aria-pressed", "false"); });
      cb.setAttribute("aria-pressed", "true"); return;
    }
    var mv = e.target.closest(".mv");
    if (mv) {
      var pos = parseInt(mv.getAttribute("data-pos"), 10), d = parseInt(mv.getAttribute("data-dir"), 10), tmp = cur.seq[pos];
      cur.seq[pos] = cur.seq[pos + d]; cur.seq[pos + d] = tmp;
      document.getElementById("olist").innerHTML = orderHtml(); return;
    }
    if (e.target.closest("#check")) { evaluate(); return; }
  }
  var b = e.target.closest("button");
  if (!b) return;
  if (b.id === "go") {
    var pool = shuffle(Q.filter(function (x) { return sel.topics.indexOf(x.t) > -1; }));
    if (sel.n > 0) pool = pool.slice(0, sel.n);
    begin(pool);
  } else if (b.id === "next") next();
  else if (b.id === "redo") begin(shuffle(run.wrongItems));
  else if (b.id === "again") start();
});

document.addEventListener("keydown", function (e) {
  if (!run || !cur || !document.getElementById("fb")) return;
  var q = cur.q;
  if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-region") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); return; }
  var tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "SELECT") { if (e.key === "Enter" && !cur.answered) { var c = document.getElementById("check"); if (c) c.click(); } return; }
  var n = parseInt(e.key, 10);
  if (!cur.answered && (q.type === "mc" || q.type === "tf") && n >= 1 && n <= cur.order.length) immediate(cur.order[n - 1]);
  else if (e.key === "Enter") {
    if (cur.answered) { var nb = document.getElementById("next"); if (nb && document.activeElement !== nb) nb.click(); }
  }
});

start();
</script>

</body></html>
